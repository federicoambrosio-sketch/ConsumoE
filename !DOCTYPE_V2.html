<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Evaluación de Consumo Energético</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
    }
    h1, h2 {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    button {
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 4px;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover {
      background: #1e40af;
    }
    .resultados {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 6px;
      margin-top: 24px;
    }
    .box {
      background: #ffffff;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Evaluación de Consumo Energético</h1>

  <h2>Datos de la vivienda</h2>

  <label>Superficie cubierta (m²)</label>
  <input type="number" id="superficie" min="0">

  <label>Provincia</label>
  <select id="provincia">
    <option value="">Seleccionar provincia</option>
    <option>Buenos Aires</option>
    <option>CABA</option>
    <option>Catamarca</option>
    <option>Chaco</option>
    <option>Chubut</option>
    <option>Córdoba</option>
    <option>Corrientes</option>
    <option>Entre Ríos</option>
    <option>Formosa</option>
    <option>Jujuy</option>
    <option>La Pampa</option>
    <option>La Rioja</option>
    <option>Mendoza</option>
    <option>Misiones</option>
    <option>Neuquén</option>
    <option>Río Negro</option>
    <option>Salta</option>
    <option>San Juan</option>
    <option>San Luis</option>
    <option>Santa Cruz</option>
    <option>Santa Fe</option>
    <option>Santiago del Estero</option>
    <option>Tierra del Fuego</option>
    <option>Tucumán</option>
  </select>

  <h2>Consumo eléctrico (kWh)</h2>
  <div class="grid">
    <script>
      for (let i = 1; i <= 6; i++) {
        document.write(`
          <div>
            <label>Periodo ${i}</label>
            <input type="number" id="elec_${i}" min="0">
          </div>
        `);
      }
    </script>
  </div>

  <h2>Consumo de gas (m³)</h2>

  <label>Tipo de combustible</label>
  <select id="tipo_gas" onchange="actualizarPCI()">
    <option value="GN">Gas Natural</option>
    <option value="GLP">GLP</option>
  </select>

  <label>PCI (kWh/m³)</label>
  <input type="text" id="pci" disabled>

  <div class="grid">
    <script>
      for (let i = 1; i <= 6; i++) {
        document.write(`
          <div>
            <label>Periodo ${i}</label>
            <input type="number" id="gas_${i}" min="0">
          </div>
        `);
      }
    </script>
  </div>

  <button onclick="calcularYEnviar()">Calcular y enviar</button>

  <div class="resultados" id="resultados" style="display:none">
    <h2>Resultados</h2>

    <div class="box">
      <strong>Energía útil</strong><br>
      Electricidad: <span id="eu_elec"></span> kWh<br>
      Gas: <span id="eu_gas"></span> kWh
    </div>

    <div class="box">
      <strong>Energía primaria</strong><br>
      Electricidad: <span id="ep_elec"></span> kWh<br>
      Gas: <span id="ep_gas"></span> kWh<br>
      <strong>Total: <span id="ep_total"></span> kWh</strong>
    </div>

    <div class="box">
      <strong>Indicador final</strong><br>
      <span id="indicador"></span> kWh/m²·año
    </div>
  </div>
</div>

<script>
  const TOKEN = "TU_TOKEN";
  const BASE_ID = "TU_BASE_ID";
  const TABLA = "Registros";

  function actualizarPCI() {
    const tipo = document.getElementById("tipo_gas").value;
    document.getElementById("pci").value = tipo === "GLP" ? 12.8 : 9.3;
  }
  actualizarPCI();

  function calcularYEnviar() {
    const superficie = Number(document.getElementById("superficie").value);
    const provincia = document.getElementById("provincia").value;

    if (!superficie || !provincia) {
      alert("Completá superficie y provincia.");
      return;
    }

    let elec = 0;
    let gas = 0;

    for (let i = 1; i <= 6; i++) {
      elec += Number(document.getElementById(`elec_${i}`).value || 0);
      gas += Number(document.getElementById(`gas_${i}`).value || 0);
    }

    const pci = Number(document.getElementById("pci").value);

    const euElec = elec;
    const euGas = gas * pci;

    const epElec = euElec * 3.3;
    const epGas = euGas * 1.25;
    const epTotal = epElec + epGas;

    const indicador = epTotal / superficie;

    document.getElementById("eu_elec").textContent = euElec.toFixed(0);
    document.getElementById("eu_gas").textContent = euGas.toFixed(0);
    document.getElementById("ep_elec").textContent = epElec.toFixed(0);
    document.getElementById("ep_gas").textContent = epGas.toFixed(0);
    document.getElementById("ep_total").textContent = epTotal.toFixed(0);
    document.getElementById("indicador").textContent = indicador.toFixed(1);

    document.getElementById("resultados").style.display = "block";

    const fields = {
      superficie,
      provincia,
      tipo_gas: document.getElementById("tipo_gas").value,
      pci,
      eu_elec: euElec,
      eu_gas: euGas,
      ep_elec: epElec,
      ep_gas: epGas,
      ep_total: epTotal,
      indicador
    };

    for (let i = 1; i <= 6; i++) {
      fields[`elec_${i}`] = Number(document.getElementById(`elec_${i}`).value || 0);
      fields[`gas_${i}`] = Number(document.getElementById(`gas_${i}`).value || 0);
    }

    fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLA}`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${TOKEN}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ fields })
    })
    .then(r => r.json())
    .then(() => alert("Datos y resultados guardados en Airtable"))
    .catch(() => alert("Error al guardar en Airtable"));
  }
</script>

</body>
</html>
